name: connect-frontend

services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/khanhnkq/connectcg-frontend}:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
      VITE_WS_URL: ${VITE_WS_URL:?VITE_WS_URL is required}
      VITE_OAUTH2_GOOGLE_URL: ${VITE_OAUTH2_GOOGLE_URL:?VITE_OAUTH2_GOOGLE_URL is required}
      VITE_OAUTH2_FACEBOOK_URL: ${VITE_OAUTH2_FACEBOOK_URL:?VITE_OAUTH2_FACEBOOK_URL is required}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_DATABASE_URL: ${VITE_FIREBASE_DATABASE_URL:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
